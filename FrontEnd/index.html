<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzaria Fullstack</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="page">

  <header class="hero">
    <div>
      <p class="eyebrow">Projeto Fullstack Pizzaria</p>
      <h1>🍕 CodePizza 🍕</h1>
      <p class="subtitle">
        Sistema para gerenciar clientes, pizzas, pedidos e desenvolvedores de sabor da CodePizza.
      </p>
    </div>

    <a
      class="docs-link"
      href="http://localhost:3000/api/docs"
      target="_blank"
    >
      Abrir Swagger
    </a>
  </header>

<!-- Tela de Login -->
<div id="login-container" class="login-card">
  <h2>Entrar</h2>
  <form onsubmit="validarLogin(event)">
    <label for="email">E-mail</label>
    <input type="email" id="email" required>

    <label for="senha">Senha</label>
    <input type="password" id="senha" required>

    <button type="submit">Login</button>
    <button type="button" class="secondary">Criar Conta</button>
  </form>
</div>


<!-- Tela de Cadastro -->
<div id="register-container" style="display:none;">
  <form id="register-form" class="stack">
    <h2>Criar usuário</h2>
    <label>Nome <input type="text" required></label>
    <label>E-mail <input type="email" required></label>
    <label>Senha <input type="password" required></label>
    <button type="submit">Cadastrar</button>
    <button type="button" onclick="mostrarLogin()">Cancelar</button>
  </form>
</div>

<!-- Tela Principal (Pedidos) -->
<div id="sistema-container" style="display:none;">
  <h2>Novo Pedido</h2>
  <label>Cliente <input type="text"></label>
  <label>Pizza <input type="text"></label>
  <label>Status <input type="text"></label>
  <button>Salvar</button>
  <button>Cancelar</button>
</div>

<div id="sistema-container" style="display:none;">
  <h2>Novo Pedido</h2>
  <!-- conteúdo do sistema -->
</div>

      </div>

    </div>

  </section>

</div>

<script src="./app.js"></script>

</body>
</html>
